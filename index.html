<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabio Oliveira 30300 — Faça parte do time</title>
<meta name="description" content="Faça parte do time que vai transformar o Paraná com Fabio Oliveira, 30300.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #0A1B3D;
    --navy-deep: #061027;
    --lime: #C7DB2E;
    --white: #FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Montserrat',sans-serif;
    background:var(--navy-deep);
    color:var(--white);
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  img{max-width:100%;display:block;}

  .banner{
    width:100%;
    line-height:0;
  }
  .banner img{width:100%;height:auto;}

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px 24px 64px;
    text-align:center;
    background:
      radial-gradient(120% 160% at 50% 0%, rgba(199,219,46,0.08) 0%, transparent 55%),
      var(--navy-deep);
  }
  .content{max-width:620px;}
  h1{
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:clamp(28px,5vw,42px);
    line-height:1.18;
    letter-spacing:-0.01em;
  }
  h1 .lime{color:var(--lime);}
  p.sub{
    margin-top:18px;
    font-size:16.5px;
    line-height:1.6;
    color:rgba(255,255,255,0.72);
  }

  .cta{
    margin-top:36px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:'Montserrat',sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:.01em;
    padding:18px 34px;
    border-radius:999px;
    background:var(--lime);
    color:var(--navy-deep);
    box-shadow:0 10px 30px -10px rgba(199,219,46,0.55);
    transition:transform .18s ease, background .18s ease;
  }
  .btn:hover{background:var(--white);transform:translateY(-2px);}
  .btn svg{flex:0 0 auto;}

  .cta-note{
    font-size:12.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.4);
    font-family:'Montserrat',sans-serif;
    font-weight:600;
  }

  footer{
    padding:22px 24px 30px;
    text-align:center;
    font-size:11.5px;
    line-height:1.7;
    color:rgba(255,255,255,0.35);
  }

  :focus-visible{outline:2px solid var(--lime);outline-offset:3px;}
</style>
</head>
